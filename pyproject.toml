[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "align2rawsignal"
version = "3.0.0"
description = "Creates genome-wide raw or normalized signal tracks from aligned sequencing reads (BAM/tagAlign)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Anshul Kundaje"},
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pysam>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
align2rawsignal = "align2rawsignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
